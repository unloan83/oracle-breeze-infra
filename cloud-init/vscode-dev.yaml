#cloud-config
package_update: true
package_upgrade: true
ssh_pwauth: false
disable_root: true

packages:
  - build-essential
  - ca-certificates
  - curl
  - git
  - gnupg
  - openssh-server
  - python3
  - python3-pip
  - python3-venv
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/60-vscode-remote.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin no
      AllowTcpForwarding yes
      X11Forwarding no

  - path: /usr/local/sbin/install-vscode-dev-tools
    owner: root:root
    permissions: "0750"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      install -m 0755 -d /etc/apt/keyrings

      # Node.js 24 is an LTS release. NodeSource supplies arm64 packages.
      curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
        | gpg --dearmor --yes -o /etc/apt/keyrings/nodesource.gpg
      chmod a+r /etc/apt/keyrings/nodesource.gpg
      printf '%s\n' \
        'deb [arch=arm64 signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main' \
        > /etc/apt/sources.list.d/nodesource.list

      # Docker Engine and Compose v2 from Docker's signed Ubuntu repository.
      . /etc/os-release
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      cat > /etc/apt/sources.list.d/docker.sources <<EOF
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: ${VERSION_CODENAME}
      Components: stable
      Architectures: arm64
      Signed-By: /etc/apt/keyrings/docker.asc
      EOF

      # Tailscale's signed Ubuntu Jammy repository supports arm64.
      curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg \
        -o /usr/share/keyrings/tailscale-archive-keyring.gpg
      curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.tailscale-keyring.list \
        -o /etc/apt/sources.list.d/tailscale.list

      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        nodejs \
        docker-ce \
        docker-ce-cli \
        containerd.io \
        docker-buildx-plugin \
        docker-compose-plugin \
        tailscale

      # Docker group membership is root-equivalent and is intentionally limited
      # to the development VM's ubuntu account.
      usermod -aG docker ubuntu
      systemctl enable --now docker.service containerd.service tailscaled.service

runcmd:
  - [install, -d, -o, ubuntu, -g, ubuntu, -m, "0750", /home/ubuntu/workspace]
  - [/usr/local/sbin/install-vscode-dev-tools]
  - [sshd, -t]
  - [systemctl, reload, ssh.service]
  - [systemctl, enable, --now, apt-daily-upgrade.timer]
  # Tailscale authentication is deliberately deferred so its key is never
  # exposed in instance metadata or Terraform state.

final_message: "VS Code development VM bootstrap complete. Connect with Remote-SSH and run sudo tailscale up."
